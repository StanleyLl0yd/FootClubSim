name: Core contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  core:
    name: TypeScript and domain tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and unit tests
        run: npm run check
      - name: M1 synthetic diagnostic smoke (128 seeds, NOT calibration)
        run: node scripts/m1-diagnostics.mjs --count=128 --first-seed=1
      - name: M1 paired tactical sensitivity smoke (NOT calibration)
        run: node scripts/m1-diagnostics.mjs --count=64 --first-seed=1 --paired-home-tempo=100
      - name: M1 v7 deterministic cohort smoke (32 seeds, NOT calibration)
        run: node scripts/m1-v7-diagnostics.mjs --count=32 --first-seed=1
      - name: M1 v8 paired medical counterfactual smoke (32 seeds, NOT calibration)
        run: node scripts/m1-v8-medical-diagnostics.mjs --count=32 --first-seed=1
      - name: M1 v8 bounded career journal workload smoke (8 fixtures, NOT gate)
        run: node scripts/m1-v8-career-benchmark.mjs --fixture-count=8 --first-seed=1
      - name: M1 v8 source-replayed atomic batch profile (8 fixtures, NOT gate)
        run: node scripts/m1-v8-career-benchmark.mjs --fixture-count=8 --first-seed=1 --batch-size=8
      - name: M1 v8 coherent batch with three independent views (8 fixtures, NOT gate)
        run: node scripts/m1-v8-career-benchmark.mjs --fixture-count=8 --first-seed=1 --batch-size=8 --coherent-preview
      - name: Assert independent core and browser outputs coexist
        run: |
          test -s dist/core/save.js
          test -s web-dist/index.html
      - name: Check generated M0 shipping-bundle boundary
        run: python3 scripts/check_m0_bundle.py
