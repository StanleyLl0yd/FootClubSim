name: Browser smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  browser:
    name: Built app renders in Chromium
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static app
        run: npm run build:web
      - name: Verify real Chromium renders the React app
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/footclubsim-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/footclubsim-preview.log
            exit 1
          fi
          browser=""
          for executable in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$executable" >/dev/null 2>&1; then
              browser="$executable"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo 'No Chromium executable on runner'
            exit 1
          fi
          timeout 60 "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:4173/ \
            >/tmp/footclubsim-dom.html 2>/tmp/footclubsim-browser.log
          grep -Fq 'Начало карьеры' /tmp/footclubsim-dom.html
          grep -Fq 'Календарь' /tmp/footclubsim-dom.html
          grep -Fq 'Сохранения' /tmp/footclubsim-dom.html
          echo 'React M0 shell rendered in Chromium'

      - name: Build M1 isolated domain modules for native IndexedDB smoke
        run: npm run build:core
      - name: Exercise v7 CAS in native Chromium with real page reload
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/footclubsim-m1-cas-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5173/examples/m1-v7-cas-smoke.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/footclubsim-m1-cas-dev.log
            exit 1
          fi
          browser=""
          for executable in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$executable" >/dev/null 2>&1; then
              browser="$executable"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo 'No Chromium executable on runner'
            exit 1
          fi
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v7-cas-smoke.html
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v8-cas-smoke.html M1_V8_BROWSER_CAS
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v26-cas-smoke.html M1_V26_BROWSER_CAS
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v32-cas-smoke.html M1_V32_BROWSER_CAS
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v78-cas-smoke.html M1_V78_BROWSER_CAS
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            'http://127.0.0.1:5173/examples/m1-v80-interactive-career.html?selftest=init' M1_V80_BROWSER_INTERACTIVE
          echo 'Real Chromium persisted v32 schema-6 causal medical journal and serialized CAS'
          echo 'Real Chromium persisted v26 schema-5 physical-exposure journal and serialized CAS'
          echo 'Real Chromium persisted v8 special-goal and medical dossier over navigation'
          echo 'Real Chromium persisted v7, survived reload and serialized competing CAS writes'


  chromium-windows:
    name: Windows ${{ matrix.browser }} app and native v7 CAS
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        browser: [Edge, Chrome]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static app
        run: npm run build:web
      - name: Build isolated M1 modules for real Windows CAS
        run: npm run build:core
      - name: Verify real Windows browser save/reload and restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preview = Start-Process -FilePath 'node' -ArgumentList @('node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4173','--strictPort') -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/footclubsim-preview-out.log" -RedirectStandardError "$env:RUNNER_TEMP/footclubsim-preview-err.log"
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not start' }
            $browserName = '${{ matrix.browser }}'
            if ($browserName -eq 'Chrome') {
              $candidates = @(
                "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
              )
            } else {
              $candidates = @(
                "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
                "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
              )
            }
            $executable = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $executable) { throw "$browserName executable unavailable on Windows runner" }
            node scripts/chromium-e2e.mjs "$executable"
            if ($LASTEXITCODE -ne 0) { throw "$browserName interactive smoke failed with code $LASTEXITCODE" }
            $privateFlag = if ($browserName -eq 'Chrome') { '--incognito' } else { '--inprivate' }
            node scripts/chromium-e2e.mjs "$executable" 'http://127.0.0.1:4173/' "$privateFlag"
            if ($LASTEXITCODE -ne 0) { throw "$browserName private-session smoke failed with code $LASTEXITCODE" }
            Write-Host "React M0 shell rendered, saved and restored in Windows $browserName and private-mode smoke passed"
            $casServer = Start-Process -FilePath 'node' -ArgumentList @('node_modules/vite/bin/vite.js','--host','127.0.0.1','--port','5173','--strictPort') -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/footclubsim-v7-dev-out.log" -RedirectStandardError "$env:RUNNER_TEMP/footclubsim-v7-dev-err.log"
            try {
              $ready = $false
              foreach ($attempt in 1..40) {
                try {
                  $response = Invoke-WebRequest -Uri 'http://127.0.0.1:5173/examples/m1-v7-cas-smoke.html' -TimeoutSec 2
                  if ($response.StatusCode -eq 200) { $ready = $true; break }
                } catch {}
                Start-Sleep -Seconds 1
              }
              if (-not $ready) { throw 'Vite v7 CAS test server did not start' }
              node scripts/m1-v7-cdp-smoke.mjs "$executable" 'http://127.0.0.1:5173/examples/m1-v7-cas-smoke.html'
              if ($LASTEXITCODE -ne 0) { throw "$browserName native v7 CAS smoke failed with code $LASTEXITCODE" }
              Write-Host "PASS: native Windows $browserName v7 IndexedDB reload and competing CAS writes"
              node scripts/m1-v7-cdp-smoke.mjs "$executable" 'http://127.0.0.1:5173/examples/m1-v8-cas-smoke.html' 'M1_V8_BROWSER_CAS'
              if ($LASTEXITCODE -ne 0) { throw "$browserName native v8 CAS smoke failed with code $LASTEXITCODE" }
              Write-Host "PASS: native Windows $browserName v8 medical/goal dossier survived reload and CAS conflict"
              node scripts/m1-v7-cdp-smoke.mjs "$executable" 'http://127.0.0.1:5173/examples/m1-v26-cas-smoke.html' 'M1_V26_BROWSER_CAS'
              if ($LASTEXITCODE -ne 0) { throw "$browserName native v26 CAS smoke failed with code $LASTEXITCODE" }
              Write-Host "PASS: native Windows $browserName v26 schema-5 journal reload and competing CAS writes"
              node scripts/m1-v7-cdp-smoke.mjs "$executable" 'http://127.0.0.1:5173/examples/m1-v32-cas-smoke.html' 'M1_V32_BROWSER_CAS'
              if ($LASTEXITCODE -ne 0) { throw "$browserName native v32 CAS smoke failed with code $LASTEXITCODE" }
              Write-Host "PASS: native Windows $browserName v32 schema-6 journal reload and competing CAS writes"
              node scripts/m1-v7-cdp-smoke.mjs "$executable" 'http://127.0.0.1:5173/examples/m1-v78-cas-smoke.html' 'M1_V78_BROWSER_CAS'
              if ($LASTEXITCODE -ne 0) { throw "$browserName native v78 medical admission CAS failed with code $LASTEXITCODE" }
              Write-Host "PASS: native Windows $browserName v78 medical admission, reload and competing CAS writes"
              node scripts/m1-v7-cdp-smoke.mjs "$executable" 'http://127.0.0.1:5173/examples/m1-v80-interactive-career.html?selftest=init' 'M1_V80_BROWSER_INTERACTIVE'
              if ($LASTEXITCODE -ne 0) { throw "$browserName native v80 interactive match UI failed with code $LASTEXITCODE" }
              Write-Host "PASS: native Windows $browserName v80 interactive match saved and replayed after navigation"
            } finally {
              Stop-Process -Id $casServer.Id -Force -ErrorAction SilentlyContinue
            }
          } finally {
            Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue
          }

  safari-macos:
    name: Safari M0 restore and native v7 IndexedDB CAS
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build production shell
        run: npm run build:web
      - name: Build isolated M1 modules for native Safari CAS
        run: npm run build:core
      - name: Enable local Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Verify Safari render and IndexedDB restore
        run: python3 scripts/macos-safari-smoke.py
