name: M1 P5 v24 synthetic causal workload (not calibrated)

on:
  pull_request:
    paths:
      - '.github/workflows/m1-p5-v24-causal-benchmark.yml'
  workflow_dispatch:
    inputs:
      seed_start:
        description: 'First positive 32-bit seed'
        required: false
        type: number
        default: 1
      seed_count:
        description: 'Positive seeds per fixture (1-128)'
        required: false
        type: number
        default: 16
      fixture_count:
        description: 'Synthetic fixtures (1-32)'
        required: false
        type: number
        default: 8

permissions: {}

concurrency:
  group: m1-v24-causal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-observation:
    name: v24 source replay across bounded synthetic fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SEED_START: ${{ inputs.seed_start }}
      SEED_COUNT: ${{ inputs.seed_count }}
      FIXTURE_COUNT: ${{ inputs.fixture_count }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated M1 core
        run: npm run build:core
      - name: Run bounded causal source and capture one observed elapsed time
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          start="${SEED_START:-1}"
          count="${SEED_COUNT:-4}"
          fixtures="${FIXTURE_COUNT:-3}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          TIMEFORMAT='observed_elapsed_seconds=%R'
          { time node --max-old-space-size=512             scripts/m1-v24-causal-corpus.mjs             --start="$start" --count="$count" --fixtures="$fixtures"             > "$work/report.json"; } 2> "$work/timing.txt"
          {
            echo '## v24 synthetic source-replay cohort (NOT real-data calibration)'
            echo
            echo 'Node 24; ubuntu-24.04 hosted runner; one observed timing only.'
            echo 'This is neither a memory/latency acceptance gate nor an RPL reference.'
            echo
            echo '~~~text'
            cat "$work/timing.txt"
            echo '~~~'
            echo
            echo '~~~json'
            cat "$work/report.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
