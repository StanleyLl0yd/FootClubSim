name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependency graph without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all runtime and development dependencies
        run: npm audit --audit-level=high
      # Only PRs have a meaningful base/head dependency diff. This reuses the
      # existing mandatory status context instead of adding an optional check.
      - name: Reject newly introduced high-severity vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
