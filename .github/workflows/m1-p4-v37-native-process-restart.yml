name: M1 P4 v37 committed IDB browser restart (not a gate)

on:
  pull_request:
    paths:
      - '.github/workflows/m1-p4-v37-native-process-restart.yml'
      - 'examples/m1-v37-process-restart.html'
      - 'scripts/m1-v37-cdp-restart.mjs'
      - 'docs/M1_V37_NATIVE_PROCESS_RESTART.md'
  workflow_dispatch:

permissions: {}

jobs:
  process-restart:
    name: Native Chromium acknowledged CAS survives SIGKILL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js pinned
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile isolated M1 domain
        run: npm run build:core
      - name: Native Chromium process termination and exact-profile restart
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/m1-v37-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:5173/examples/m1-v37-process-restart.html' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/m1-v37-vite.log; exit 1; fi
          browser=""
          for exe in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$exe" >/dev/null 2>&1; then browser="$exe"; break; fi
          done
          [[ -n "$browser" ]] || { echo 'Chromium missing'; exit 1; }
          node scripts/m1-v37-cdp-restart.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v37-process-restart.html
