<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>M1 v43 native Worker CAS</title></head>
<body>
  <h1>Development-only schema-6 DedicatedWorker replay</h1>
  <pre id="status">M1_V43_BROWSER_WORKER_RUNNING</pre>
  <script type="module">
    import { createSyntheticRplScaleCatalog, defaultSyntheticLineup }
      from '../dist/core/synthetic.js';
    import { createInitialCareer } from '../dist/core/save.js';
    import { saveNewInitialCareer, loadInitialCareer }
      from '../dist/browser/initial-career-store.js';
    import { createM1V32PersistedJournal, loadM1V32PersistedJournal }
      from '../dist/browser/m1-v32-journal-store.js';
    import { commitM1V43ViaDedicatedWorker }
      from '../dist/browser/m1-v43-schema6-worker-client.js';
    import { deriveM1V31CausalPhysicalExposure }
      from '../dist/core/m1-v24-physical-exposure.js';
    import { generateDoubleRoundRobin } from '../dist/core/fixtures.js';
    import { MATCH_LEDGER_VERSION, M0_RULES_PACK_ID, M0_RULES_PACK_VERSION }
      from '../dist/core/match-contracts.js';
    import { M1_ENGINE_VERSION } from '../dist/core/m1-clock.js';
    import { RNG_VERSION } from '../dist/core/rng.js';
    import { defaultTacticalPlan } from '../dist/core/tactics.js';

    const status=document.querySelector('#status');
    const check=(condition,why)=>{if(!condition)throw Error(why);};
    const catalog=createSyntheticRplScaleCatalog(77);
    const career=createInitialCareer(
      catalog,catalog.clubs[0].id,42,'m1-v43-native-worker');
    const fixtures=generateDoubleRoundRobin(catalog.clubs.map(c=>c.id))
      .flatMap(round=>round.fixtures).slice(0,6);
    const clubs=new Map(catalog.clubs.map(c=>[c.id,c]));
    const policy={
      home:{assignedActor:{kind:'player'},availableStaffIds:[]},
      away:{assignedActor:{kind:'player'},availableStaffIds:[]},
    };
    function command(index){
      const fixture=fixtures[index];
      const prematch={
        schemaVersion:MATCH_LEDGER_VERSION,engineVersion:M1_ENGINE_VERSION,
        rulesPackId:M0_RULES_PACK_ID,rulesPackVersion:M0_RULES_PACK_VERSION,
        fixture,catalog,
        homeLineup:defaultSyntheticLineup(clubs.get(fixture.homeClubId)),
        awayLineup:defaultSyntheticLineup(clubs.get(fixture.awayClubId)),
        homeTactics:defaultTacticalPlan(fixture.homeClubId),
        awayTactics:defaultTacticalPlan(fixture.awayClubId),
        rosterRules:{starterCount:11,maxBench:12,maxForeignersOnField:7},
        rngAlgorithmVersion:RNG_VERSION,rngSeed:1,
      };
      for(let seed=1;seed<=128;seed++){
        prematch.rngSeed=seed;
        const result=deriveM1V31CausalPhysicalExposure(
          prematch,policy,[],[]);
        if(!result.ok)continue;
        return {schemaVersion:6,commandId:'v43-native-'+index,
          careerId:career.careerId,expectedRevision:index,
          prematch:{...prematch},policy,
          halfTimeCommands:[],inPlayCommands:[],result};
      }
      throw Error('NO_ADMISSIBLE_SOURCE:'+fixture.id);
    }
    async function run(){
      check(fixtures.length===6,'missing fixtures');
      const stage=new URL(location.href).searchParams.get('stage');
      check(stage===null||stage==='verify','unexpected stage');
      if(stage===null){
        await saveNewInitialCareer(career);
        await createM1V32PersistedJournal(career.careerId);
        let responsive=0;
        for(let index=0;index<4;index++){
          const prepared=command(index);
          let ticks=0;
          const interval=setInterval(()=>{ticks++;},10);
          let receipt;
          try{
            receipt=await commitM1V43ViaDedicatedWorker({
              schemaVersion:1,kind:'commit',jobId:'v43-job-'+index,
              careerId:career.careerId,expectedRevision:index,
              requests:[prepared],
            });
          }finally{clearInterval(interval);}
          check(receipt.careerId===career.careerId &&
            receipt.jobId==='v43-job-'+index &&
            receipt.journalRevision===index+1,
            'worker receipt mismatch');
          if(index>=2&&ticks>0)responsive++;
        }
        check(responsive===2,'page heartbeat missed later Worker CAS');
        // Two real DedicatedWorkers race for the same revision.
        const attempts=await Promise.allSettled([4,5].map(index=>
          commitM1V43ViaDedicatedWorker({
            schemaVersion:1,kind:'commit',jobId:'v43-race-'+index,
            careerId:career.careerId,expectedRevision:4,
            requests:[{...command(index),expectedRevision:4}],
          })));
        const accepted=attempts.map((outcome,index)=>({
          outcome,index,
        })).filter(row=>row.outcome.status==='fulfilled');
        const rejected=attempts.filter(row=>row.status==='rejected');
        const diagnosis=attempts.map((entry,index)=>({
          index,
          status:entry.status,
          ...(entry.status==='fulfilled'?
            {revision:entry.value.journalRevision}:
            {code:entry.reason?.code ?? 'UNKNOWN',
              message:String(entry.reason?.message ?? entry.reason)}),
        }));
        check(accepted.length===1&&rejected.length===1 &&
          rejected[0].reason?.code==='STALE_REVISION',
          'competing worker CAS did not serialize safely: '+
            JSON.stringify(diagnosis));
        const winner=accepted[0].index+4;
        check(accepted[0].outcome.value.journalRevision===5,
          'competing worker won with incorrect revision');
        sessionStorage.setItem('m1-v43-worker-native',String(winner));
        const next=new URL(location.href);
        next.searchParams.set('stage','verify');
        location.replace(next.href);
        return;
      }
      const winner=Number(sessionStorage.getItem('m1-v43-worker-native'));
      check(winner===4||winner===5,'no actual page navigation');
      check((await loadInitialCareer(career.careerId)).careerId===
        career.careerId,'M0 source disappeared');
      const recovered=await loadM1V32PersistedJournal(career.careerId);
      check(recovered.schemaVersion===6&&recovered.revision===5 &&
        recovered.results.length===5,'worker history lost after reload');
      for(let index=0;index<4;index++){
        check(recovered.results[index].commandId==='v43-native-'+index &&
          recovered.results[index].source.prematch.fixture.id===
            fixtures[index].id,'wrong fixture in worker journal');
      }
      check(recovered.results[4].commandId==='v43-native-'+winner &&
        recovered.results[4].source.prematch.fixture.id===fixtures[winner].id,
        'racing worker final result not recovered');
      sessionStorage.removeItem('m1-v43-worker-native');
      status.textContent='M1_V43_BROWSER_WORKER_PASS';
    }
    run().catch(error=>{
      status.textContent='M1_V43_BROWSER_WORKER_FAIL: '+
        String(error?.stack??error);
    });
  </script>
</body>
</html>
