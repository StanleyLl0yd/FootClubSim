name: M1 P4 v42 optimistic CAS native verification (not a gate)

on:
  pull_request:
    paths:
      - 'src/browser/m1-v32-journal-store.ts'
      - 'tests/m1-v32-journal-store.test.mjs'
      - 'docs/M1_V42_OPTIMISTIC_CAS.md'
      - '.github/workflows/m1-p4-v42-optimistic-cas.yml'
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Number of synthetic fixtures (1-16)'
        type: number
        required: false
        default: 8

permissions: {}

jobs:
  optimistic-cas-profile:
    name: Native Chromium optimistic CAS transaction duration and replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FIXTURE_COUNT: ${{ inputs.fixtures }}
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js pinned
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile isolated M1 domain
        run: npm run build:core
      - name: Profile actual native optimized schema-6 CAS
        shell: bash
        run: |
          set -euo pipefail
          fixtures="${FIXTURE_COUNT:-8}"
          [[ "$fixtures" =~ ^([1-9]|1[0-6])$ ]] || { echo 'Invalid fixture count'; exit 2; }
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/m1-v42-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:5173/examples/m1-v36-native-history-profile.html' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/m1-v42-vite.log; exit 1; fi
          browser=""
          for exe in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$exe" >/dev/null 2>&1; then browser="$exe"; break; fi
          done
          [[ -n "$browser" ]] || { echo 'Chromium missing'; exit 1; }
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            "http://127.0.0.1:5173/examples/m1-v36-native-history-profile.html?fixtures=$fixtures&instrument=1" \
            M1_V36_BROWSER_PROFILE | tee /tmp/m1-v42-profile.log
          {
            echo '## Native schema-6 optimized CAS observation (NOT SLA)'
            echo
            echo '~~~text'
            cat /tmp/m1-v42-profile.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check native competing writers and restart safety
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/m1-v42-replay-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:5173/examples/m1-v32-cas-smoke.html' >/dev/null; then break; fi
            sleep 1
          done
          browser=""
          for exe in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$exe" >/dev/null 2>&1; then browser="$exe"; break; fi
          done
          [[ -n "$browser" ]] || { echo 'Chromium missing'; exit 1; }
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v32-cas-smoke.html \
            M1_V32_BROWSER_CAS
          node scripts/m1-v37-cdp-restart.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v37-process-restart.html
          node scripts/m1-v38-cdp-interrupt.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v38-uncommitted-restart.html
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v40-native-two-store-recovery.html \
            M1_V40_BROWSER_RECOVERY
