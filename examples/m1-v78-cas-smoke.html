<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>M1 v78 gated browser CAS smoke</title></head>
<body>
  <h1>M1 v78 native medical admission CAS (development fixture only)</h1>
  <pre id="status">M1_V78_BROWSER_CAS_RUNNING</pre>
  <script type="module">
    import {createSyntheticRplScaleCatalog,defaultSyntheticLineup}
      from '../dist/core/synthetic.js';
    import {createInitialCareer} from '../dist/core/save.js';
    import {saveNewInitialCareer,loadInitialCareer}
      from '../dist/browser/initial-career-store.js';
    import {createM1V32PersistedJournal,loadM1V32PersistedJournal,
      commitM1V76PersistedMedicallyGatedFixture as commit}
      from '../dist/browser/m1-v32-journal-store.js';
    import {deriveM1V31CausalPhysicalExposure}
      from '../dist/core/m1-v24-physical-exposure.js';
    import {generateDoubleRoundRobin} from '../dist/core/fixtures.js';
    import {MATCH_LEDGER_VERSION,M0_RULES_PACK_ID,M0_RULES_PACK_VERSION}
      from '../dist/core/match-contracts.js';
    import {M1_ENGINE_VERSION} from '../dist/core/m1-clock.js';
    import {defaultTacticalPlan} from '../dist/core/tactics.js';
    import {RNG_VERSION} from '../dist/core/rng.js';

    const status=document.getElementById('status');
    const check=(ok,message)=>{if(!ok)throw Error(message);};
    const catalog=createSyntheticRplScaleCatalog(77);
    const career=createInitialCareer(catalog,catalog.clubs[0].id,42,
      'm1-v78-native-medical-cas');
    const clubs=new Map(catalog.clubs.map(c=>[c.id,c]));
    const fixtures=generateDoubleRoundRobin(catalog.clubs.map(c=>c.id))
      .flatMap(r=>r.fixtures);
    const policy={home:{assignedActor:{kind:'player'},availableStaffIds:[]},
      away:{assignedActor:{kind:'player'},availableStaffIds:[]}};
    function request(fixture,revision,id){
      const prematch={
        schemaVersion:MATCH_LEDGER_VERSION,engineVersion:M1_ENGINE_VERSION,
        rulesPackId:M0_RULES_PACK_ID,rulesPackVersion:M0_RULES_PACK_VERSION,
        fixture,catalog,
        homeLineup:defaultSyntheticLineup(clubs.get(fixture.homeClubId)),
        awayLineup:defaultSyntheticLineup(clubs.get(fixture.awayClubId)),
        homeTactics:defaultTacticalPlan(fixture.homeClubId),
        awayTactics:defaultTacticalPlan(fixture.awayClubId),
        rosterRules:{starterCount:11,maxBench:12,maxForeignersOnField:7},
        rngAlgorithmVersion:RNG_VERSION,rngSeed:1,
      };
      for(let seed=1;seed<=128;seed++){
        prematch.rngSeed=seed;
        const result=deriveM1V31CausalPhysicalExposure(prematch,policy);
        if(!result.ok)continue;
        return {schemaVersion:6,commandId:id,careerId:career.careerId,
          expectedRevision:revision,prematch:{...prematch},policy,
          halfTimeCommands:[],inPlayCommands:[],result};
      }
      throw Error('no source-valid seed');
    }
    async function mustFail(action,code){
      try{await action;}catch(error){
        check(error?.code===code,
          'expected '+code+', got '+String(error));return;
      }
      throw Error('missing rejection '+code);
    }
    async function run(){
      const stage=new URL(location.href).searchParams.get('stage');
      if(stage===null){
        await saveNewInitialCareer(career);
        await createM1V32PersistedJournal(career.careerId);
        const first=await commit(career.careerId,0,
          request(fixtures[0],0,'v78-native-initial'));
        check(first.revision===1&&first.results.length===1,
          'no initial guarded commit');
        const next=new URL(location.href);
        next.searchParams.set('stage','verify');
        location.replace(next.href);
        return;
      }
      check(stage==='verify','invalid navigation stage');
      const original=await loadInitialCareer(career.careerId);
      check(original.careerId===career.careerId,
        'M0 initial career changed');
      const persisted=await loadM1V32PersistedJournal(career.careerId);
      check(persisted.revision===1&&persisted.results.length===1&&
        persisted.results[0].commandId==='v78-native-initial',
        'guarded commit did not survive page navigation');
      const stale=request(fixtures[1],0,'v78-native-stale');
      await mustFail(commit(career.careerId,0,stale),'STALE_REVISION');
      const forged=request(fixtures[1],1,'v78-native-forged');
      forged.result.fixtureId='false-fixture';
      await mustFail(commit(career.careerId,1,forged),'DOMAIN_REJECTED');
      check(JSON.stringify(await loadM1V32PersistedJournal(career.careerId))===
        JSON.stringify(persisted),'forged request altered journal');
      const writers=await Promise.allSettled([
        commit(career.careerId,1,request(fixtures[1],1,'v78-writer-a')),
        commit(career.careerId,1,request(fixtures[2],1,'v78-writer-b')),
      ]);
      check(writers.filter(x=>x.status==='fulfilled').length===1,
        'concurrent writers both accepted or rejected');
      check(writers.find(x=>x.status==='rejected')?.reason?.code===
        'STALE_REVISION','concurrent losing writer not stale');
      const after=await loadM1V32PersistedJournal(career.careerId);
      check(after.revision===2&&after.results.length===2&&
        after.results[0].commandId==='v78-native-initial'&&
        ['v78-writer-a','v78-writer-b'].includes(after.results[1].commandId),
        'native CAS lost or rewrote history');
      check((await loadInitialCareer(career.careerId)).careerId===
        career.careerId,'guarded CAS rewrote M0 initial');
      status.textContent='M1_V78_BROWSER_CAS_PASS';
    }
    run().catch(error=>{
      status.textContent='M1_V78_BROWSER_CAS_FAIL: '+
        String(error?.stack??error);
    });
  </script>
</body>
</html>
