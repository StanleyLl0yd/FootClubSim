name: Browser smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/chromium-e2e.mjs'
      - 'scripts/macos-safari-smoke.py'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/browser-smoke.yml'
      # Exit-acceptance edits must be verified against all supported browsers.
      - 'docs/M0_ACCEPTANCE.md'
      - 'docs/*AUDIT*.md'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/chromium-e2e.mjs'
      - 'scripts/macos-safari-smoke.py'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/browser-smoke.yml'
      # Exit-acceptance edits must be verified against all supported browsers.
      - 'docs/M0_ACCEPTANCE.md'
      - 'docs/*AUDIT*.md'
  workflow_dispatch:

permissions: {}

jobs:
  browser:
    name: Built app renders in Chromium
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static app
        run: npm run build:web
      - name: Verify real Chromium renders the React app
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/footclubsim-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/footclubsim-preview.log
            exit 1
          fi
          browser=""
          for executable in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$executable" >/dev/null 2>&1; then
              browser="$executable"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo 'No Chromium executable on runner'
            exit 1
          fi
          timeout 60 "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:4173/ \
            >/tmp/footclubsim-dom.html 2>/tmp/footclubsim-browser.log
          grep -Fq 'Начало карьеры' /tmp/footclubsim-dom.html
          grep -Fq 'Календарь' /tmp/footclubsim-dom.html
          grep -Fq 'Сохранения' /tmp/footclubsim-dom.html
          echo 'React M0 shell rendered in Chromium'

  chromium-windows:
    name: Built app renders in Windows ${{ matrix.browser }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        browser: [Edge, Chrome]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static app
        run: npm run build:web
      - name: Verify real Windows browser save/reload and restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preview = Start-Process -FilePath 'node' -ArgumentList @('node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4173','--strictPort') -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/footclubsim-preview-out.log" -RedirectStandardError "$env:RUNNER_TEMP/footclubsim-preview-err.log"
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not start' }
            $browserName = '${{ matrix.browser }}'
            if ($browserName -eq 'Chrome') {
              $candidates = @(
                "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
              )
            } else {
              $candidates = @(
                "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
                "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
              )
            }
            $executable = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $executable) { throw "$browserName executable unavailable on Windows runner" }
            node scripts/chromium-e2e.mjs "$executable"
            if ($LASTEXITCODE -ne 0) { throw "$browserName interactive smoke failed with code $LASTEXITCODE" }
            $privateFlag = if ($browserName -eq 'Chrome') { '--incognito' } else { '--inprivate' }
            node scripts/chromium-e2e.mjs "$executable" 'http://127.0.0.1:4173/' "$privateFlag"
            if ($LASTEXITCODE -ne 0) { throw "$browserName private-session smoke failed with code $LASTEXITCODE" }
            Write-Host "React M0 shell rendered, saved and restored in Windows $browserName and private-mode smoke passed"
          } finally {
            Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue
          }

  safari-macos:
    name: Safari renders, saves and restores initial career
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build production shell
        run: npm run build:web
      - name: Enable local Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Verify Safari render and IndexedDB restore
        run: python3 scripts/macos-safari-smoke.py
