name: Wikidata candidate field diagnostic

on:
  pull_request:
    paths:
      - 'scripts/wikidata-candidate-fields.mjs'
      - 'tests/wikidata-candidate-fields.test.mjs'
      - 'scripts/wikidata-response.mjs'
      - 'tests/wikidata-response.test.mjs'
      - 'scripts/wikidata-p54-coverage.mjs'
      - 'tests/wikidata-p54-coverage.test.mjs'
      - 'data/drafts/liga-wikidata-club-map-v1.json'
      - '.github/workflows/wikidata-candidate-fields.yml'
  workflow_dispatch:

permissions: {}

jobs:
  candidate-fields:
    name: P54 candidate Wikidata field availability (not roster verification)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bounded P54 candidate fact field diagnostic
        run: node scripts/wikidata-candidate-fields.mjs
