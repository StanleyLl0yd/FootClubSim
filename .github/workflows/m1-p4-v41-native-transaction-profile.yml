name: M1 P4 v41 native CAS transaction occupancy profile (not a gate)

on:
  pull_request:
    paths:
      - '.github/workflows/m1-p4-v41-native-transaction-profile.yml'
      - 'examples/m1-v36-native-history-profile.html'
      - 'scripts/m1-v7-cdp-smoke.mjs'
      - 'docs/M1_V41_NATIVE_TRANSACTION_PROFILE.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Number of synthetic fixtures (1-16)'
        type: number
        required: false
        default: 8

permissions: {}

jobs:
  native-transaction-profile:
    name: Chromium schema-6 instrumented readwrite transaction lifetime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FIXTURE_COUNT: ${{ inputs.fixtures }}
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js pinned
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile isolated M1 domain
        run: npm run build:core
      - name: Measure native IDB readwrite occupancy and history cost
        shell: bash
        run: |
          set -euo pipefail
          fixtures="${FIXTURE_COUNT:-8}"
          [[ "$fixtures" =~ ^([1-9]|1[0-6])$ ]] || { echo 'Invalid fixture count'; exit 2; }
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/m1-v41-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:5173/examples/m1-v36-native-history-profile.html' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/m1-v41-vite.log; exit 1; fi
          browser=""
          for exe in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$exe" >/dev/null 2>&1; then browser="$exe"; break; fi
          done
          [[ -n "$browser" ]] || { echo 'Chromium missing'; exit 1; }
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            "http://127.0.0.1:5173/examples/m1-v36-native-history-profile.html?fixtures=$fixtures&instrument=1" \
            M1_V36_BROWSER_PROFILE | tee /tmp/m1-v41-profile.log
          {
            echo '## Native schema-6 readwrite transaction timeline (NOT gate)'
            echo
            echo '~~~text'
            cat /tmp/m1-v41-profile.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
