name: M1 P5 v131 source-replayed fictional incidents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-p5-v131-fictional-incident-observations.yml'
      - 'scripts/m1-p5-v131-incident-cohort.mjs'
      - 'tests/m1-p5-v131-incident-cohort.test.mjs'
      - 'src/core/m1-v130-manual-virtual-referee.ts'
      - 'src/core/m1-v128-manual-fictional-continuation.ts'
      - 'src/core/m1-v126-dense-source-holds.ts'
      - 'src/core/m1-v124-dense-internal-referee.ts'

permissions: {}

jobs:
  incident-source:
    name: fictional v120 incident seeds ${{ matrix.first_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        first_seed: [1, 9, 17, 25, 33, 41, 49, 57]
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile exact model
        run: npm run build:core
      - name: Test boundaries and source counters
        run: node --test tests/m1-p5-v131-incident-cohort.test.mjs
      - name: Measure original source-replayed fictional incident fixture attempts
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          node scripts/m1-p5-v131-incident-cohort.mjs \
            --first-seed=${{ matrix.first_seed }} \
            --seed-count=8 --fixtures=4 | tee v131-fictional-incidents.jsonl
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const raw=readFileSync("v131-fictional-incidents.jsonl","utf8").trim();
            if(!raw.startsWith("V131_FICTIONAL_INCIDENTS="))throw Error("INVALID_PREFIX");
            const report=JSON.parse(raw.slice("V131_FICTIONAL_INCIDENTS=".length));
            if(report.schemaVersion!==131 ||
                report.status!=="SOURCE_REPLAYED_FICTIONAL_INCIDENT_COHORT_NOT_CALIBRATED" ||
                report.seedCount!==8 || report.fixturesPerCareer!==4 ||
                report.seeds.length!==8 ||
                report.attempted!==report.accepted+report.rejected ||
                report.verifiedVirtualSources!==report.accepted ||
                report.replayedJournals!==8 ||
                report.totals.homeWins+report.totals.draws+
                  report.totals.awayWins!==report.accepted ||
                report.syntheticEventAuthorityOnly!==true ||
                report.independentRealCardsDefinitionAligned!==false ||
                report.independentRealInjuriesDefinitionAligned!==false ||
                report.completeOpponentHistory!==false ||
                report.holdout2024_25Used!==false ||
                report.releaseP5Accepted!==false)
              throw Error("INVALID_SOURCE_DENOMINATOR_OR_RESEARCH_LABEL");
          '
          sha256sum v131-fictional-incidents.jsonl
