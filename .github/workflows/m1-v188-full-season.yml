name: M1 v188 full native source season observation

on:
  pull_request:
    paths:
      - 'src/core/m1-v188-league-source-journal.ts'
      - 'src/core/m1-v23-temporary-treatment.ts'
      - 'src/core/m1-v182-unified-source.ts'
      - 'src/core/m1-v179-source-clock.ts'
      - 'src/core/m1-v186-law5-causal.ts'
      - 'src/core/m1-v105-special-goal-chronology.ts'
      - 'tests/m1-v188-league-source-journal.test.mjs'
      - 'src/browser/m1-v188-league-store.ts'
      - 'examples/m1-v188-full-season-profile.html'
      - 'scripts/m1-v7-cdp-smoke.mjs'
      - '.github/workflows/m1-v188-full-season.yml'
  workflow_dispatch:

permissions: {}

jobs:
  full-native-season:
    name: Chromium 240-fixture source replay and IndexedDB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated source
        run: npm run build:core
      - name: Run full real-browser source season, not release SLA
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort \
            >/tmp/footclubsim-v188-native-full.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --silent --fail \
              http://127.0.0.1:5173/examples/m1-v188-full-season-profile.html \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/footclubsim-v188-native-full.log
            exit 1
          fi
          browser=""
          for executable in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$executable" >/dev/null 2>&1; then
              browser="$executable"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "No native Chromium executable"
            exit 1
          fi
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            http://127.0.0.1:5173/examples/m1-v188-full-season-profile.html \
            M1_V188_BROWSER_SEASON
