name: Documentation verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    name: Markdown links and Python unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate documentation links
        run: python3 scripts/check_docs.py
      - name: Audit tracked repository files and record metrics
        run: python3 scripts/repo_audit.py
      - name: Parse manual GitHub ruleset administration script (never execute it in CI)
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $file = Join-Path $env:GITHUB_WORKSPACE 'scripts/configure-github-rules.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'PowerShell operator script parses successfully; no administrative actions executed'
