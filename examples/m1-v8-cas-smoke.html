<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>M1 v8 IndexedDB CAS smoke</title></head>
<body>
  <h1>M1 v8 IndexedDB smoke (development test only)</h1>
  <pre id="status">M1_V8_BROWSER_CAS_RUNNING</pre>
  <script type="module">
    import { createSyntheticRplScaleCatalog, defaultSyntheticLineup }
      from '../dist/core/synthetic.js';
    import { createInitialCareer } from '../dist/core/save.js';
    import { saveNewInitialCareer, loadInitialCareer }
      from '../dist/browser/initial-career-store.js';
    import { createM1V8PersistedJournal, loadM1V8PersistedJournal,
      commitM1V8PersistedBatch } from '../dist/browser/m1-v8-journal-store.js';
    import { generateDoubleRoundRobin } from '../dist/core/fixtures.js';
    import { simulateM1V8MedicalPhases } from '../dist/core/m1-v8-medical-phases.js';
    import { MATCH_LEDGER_VERSION, M0_RULES_PACK_ID, M0_RULES_PACK_VERSION }
      from '../dist/core/match-contracts.js';
    import { M1_ENGINE_VERSION } from '../dist/core/m1-clock.js';
    import { defaultTacticalPlan } from '../dist/core/tactics.js';
    import { RNG_VERSION } from '../dist/core/rng.js';

    const status = document.getElementById('status');
    const check = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const catalog = createSyntheticRplScaleCatalog(71);
    const career = createInitialCareer(catalog, catalog.clubs[0].id, 19, 'm1-v8-native-cas');
    const fixtures = generateDoubleRoundRobin(catalog.clubs.map(club => club.id))
      .flatMap(round => round.fixtures);
    const clubs = new Map(catalog.clubs.map(club => [club.id, club]));
    const policy = {
      home: { assignedActor: { kind: 'player' }, availableStaffIds: [] },
      away: { assignedActor: { kind: 'player' }, availableStaffIds: [] },
    };
    function command(fixture, expectedRevision, commandId, seed, withMedical = false) {
      const prematch = {
        schemaVersion: MATCH_LEDGER_VERSION, engineVersion: M1_ENGINE_VERSION,
        rulesPackId: M0_RULES_PACK_ID, rulesPackVersion: M0_RULES_PACK_VERSION,
        fixture, catalog,
        homeLineup: defaultSyntheticLineup(clubs.get(fixture.homeClubId)),
        awayLineup: defaultSyntheticLineup(clubs.get(fixture.awayClubId)),
        homeTactics: defaultTacticalPlan(fixture.homeClubId),
        awayTactics: defaultTacticalPlan(fixture.awayClubId),
        rosterRules: { starterCount: 11, maxBench: 12, maxForeignersOnField: 7 },
        rngAlgorithmVersion: RNG_VERSION, rngSeed: seed,
      };
      const homeOut = prematch.homeLineup.starters.find(id =>
        catalog.players.find(p => p.id === id).primaryPosition !== 'GK');
      const awayOut = prematch.awayLineup.starters.find(id =>
        catalog.players.find(p => p.id === id).primaryPosition !== 'GK');
      const medicalActions = withMedical ? [
        { schemaVersion: 1, id: 'native-med-exit', fixtureId: fixture.id,
          teamId: fixture.homeClubId, playerId: homeOut, elapsedSeconds: 0,
          kind: 'treatment-exit', reason: 'medical-staff-entered',
          restartAtRunningSeconds: 15 },
        { schemaVersion: 1, id: 'native-med-return', fixtureId: fixture.id,
          teamId: fixture.homeClubId, playerId: homeOut, elapsedSeconds: 300,
          kind: 'treatment-return', returnContext: 'running-clock',
          ballInPlay: true, entryBoundary: 'touchline',
          refereeSignalId: 'native-synthetic-referee-claim' },
      ] : [];
      if (withMedical === 'simultaneous') {
        medicalActions.splice(1, 0, {
          schemaVersion: 1, id: 'native-med-away-exit', fixtureId: fixture.id,
          teamId: fixture.awayClubId, playerId: awayOut, elapsedSeconds: 0,
          kind: 'treatment-exit', reason: 'medical-staff-entered',
          restartAtRunningSeconds: 15,
        });
        medicalActions.push({
          schemaVersion: 1, id: 'native-med-away-return', fixtureId: fixture.id,
          teamId: fixture.awayClubId, playerId: awayOut, elapsedSeconds: 300,
          kind: 'treatment-return', returnContext: 'running-clock',
          ballInPlay: true, entryBoundary: 'touchline',
          refereeSignalId: 'native-synthetic-away-referee-claim',
        });
      }
      const trustedDecisions = withMedical ? [
        { schemaVersion: 1, decisionId: 'native-pen', fixtureId: fixture.id,
          elapsedSeconds: 600, teamId: fixture.homeClubId, playerId: homeOut,
          kind: 'penalty-kick', outcome: 'scored' },
        { schemaVersion: 1, decisionId: 'native-own', fixtureId: fixture.id,
          elapsedSeconds: 900, teamId: fixture.homeClubId, playerId: awayOut,
          kind: 'own-goal' },
      ] : [];
      const result = simulateM1V8MedicalPhases(
        prematch, policy, [], trustedDecisions, medicalActions);
      check(result.ok, 'v8 source match did not simulate');
      return { schemaVersion: 4, commandId, careerId: career.careerId,
        expectedRevision, prematch, policy,
        plannedCommands: [], trustedDecisions, medicalActions, result };
    }
    async function failCode(promise, code) {
      try { await promise; }
      catch (error) {
        check(error?.code === code, 'expected ' + code + ', got ' + String(error));
        return;
      }
      throw new Error('expected failure ' + code);
    }
    async function workerCommit(request, expectedRevision, jobId) {
      const worker = new Worker(
        new URL('../dist/browser/m1-v8-cas-worker.js', import.meta.url),
        { type: 'module' });
      return new Promise((resolve, reject) => {
        let settled = false;
        const finish = (error, journal) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          worker.terminate();
          if (error) reject(error);
          else resolve(journal);
        };
        const timeout = setTimeout(() =>
          finish(new Error('native CAS worker timed out')), 60_000);
        worker.onerror = () => finish(new Error('native CAS worker failed'));
        worker.onmessage = event => {
          const reply = event.data;
          if (reply?.schemaVersion !== 1 || reply?.jobId !== jobId ||
              reply?.careerId !== career.careerId) {
            finish(new Error('uncorrelated CAS worker response'));
            return;
          }
          if (reply.kind === 'committed') {
            finish(null, reply.journal);
          } else if (reply.kind === 'failed') {
            const error = new Error('CAS worker: ' + String(reply.code));
            error.code = reply.code;
            finish(error);
          } else {
            finish(new Error('unknown CAS worker response'));
          }
        };
        worker.postMessage({
          schemaVersion: 1, kind: 'commit', jobId,
          careerId: career.careerId, expectedRevision,
          requests: [request],
        });
      });
    }
    async function run() {
      const stage = new URL(location.href).searchParams.get('stage');
      if (stage === null) {
        await saveNewInitialCareer(career);
        const initial = await createM1V8PersistedJournal(career.careerId);
        check(initial.revision === 0, 'initial CAS revision is not zero');
        const committed = await commitM1V8PersistedBatch(career.careerId, 0,
          [command(fixtures[0], 0, 'native-first', 19, true)]);
        check(committed.revision === 1, 'first match commit not applied');
        const simultaneous = await commitM1V8PersistedBatch(career.careerId, 1,
          [command(fixtures[1], 1, 'native-simultaneous', 20, 'simultaneous')]);
        check(simultaneous.revision === 2,
          'simultaneous medical match was not committed');
        const url = new URL(location.href);
        url.searchParams.set('stage', 'verify');
        location.replace(url.href); // real navigation; no same-page in-memory result accepted
        return;
      }
      check(stage === 'verify', 'invalid stage');
      const original = await loadInitialCareer(career.careerId);
      check(original.selectedClubId === career.selectedClubId, 'M0 source changed');
      const recovered = await loadM1V8PersistedJournal(career.careerId);
      check(recovered.revision === 2 && recovered.results.length === 2,
        'two v8 fixtures were not durable over actual page reload');
      check(recovered.results[0].commandId === 'native-first', 'first committed row absent');
      check(recovered.results[0].source.medicalActions.length === 2,
        'medical source lost after browser reload');
      check(recovered.results[0].dossier.match.home.penaltyGoals === 1 &&
        recovered.results[0].dossier.match.home.ownGoalsFor === 1,
        'v8 medical/penalty/own-goal dossier was not recovered');
      const second = recovered.results[1];
      check(second.commandId === 'native-simultaneous',
        'second committed fixture lost after browser navigation');
      check(second.source.medicalActions.length === 4,
        'independent same-phase medical events were not persisted');
      check(second.source.medicalActions[0].elapsedSeconds === 0 &&
        second.source.medicalActions[1].elapsedSeconds === 0 &&
        second.source.medicalActions[2].elapsedSeconds === 300 &&
        second.source.medicalActions[3].elapsedSeconds === 300,
      'same-phase medical chronology was altered after browser recovery');
      check(second.dossier.match.home.penaltyGoals === 1 &&
        second.dossier.match.home.ownGoalsFor === 1,
        'simultaneous treatment changed confirmed special-goal attribution');
      await failCode(createM1V8PersistedJournal(career.careerId), 'ALREADY_EXISTS');
      await failCode(commitM1V8PersistedBatch(career.careerId, 0,
        [command(fixtures[1], 0, 'stale', 20)]), 'STALE_REVISION');
      const results = await Promise.allSettled([
        commitM1V8PersistedBatch(career.careerId, 2,
          [command(fixtures[2], 2, 'native-writer-a', 22)]),
        commitM1V8PersistedBatch(career.careerId, 2,
          [command(fixtures[3], 2, 'native-writer-b', 23)]),
      ]);
      check(results.filter(item => item.status === 'fulfilled').length === 1,
        'concurrent writers both won or both failed');
      const loser = results.find(item => item.status === 'rejected');
      check(loser.reason?.code === 'STALE_REVISION', 'loser was not a stale CAS');
      const journal = await loadM1V8PersistedJournal(career.careerId);
      check(journal.revision === 3 && journal.results.length === 3,
        'concurrent writers lost or duplicated a commit');
      check(journal.results[0].commandId === 'native-first' &&
        journal.results[1].commandId === 'native-simultaneous',
        'concurrency overwrote earlier ordinary or simultaneous treatment');
      const workerResult = await workerCommit(
        command(fixtures[4], 3, 'native-worker', 24, true),
        3, 'native-worker-job');
      check(workerResult.revision === 4 &&
        workerResult.results[3].commandId === 'native-worker',
        'isolated worker did not commit the fourth fixture');
      await failCode(workerCommit(
        command(fixtures[5], 3, 'native-worker-stale', 25),
        3, 'native-stale-worker-job'), 'STALE_REVISION');
      const afterWorker = await loadM1V8PersistedJournal(career.careerId);
      check(afterWorker.revision === 4 && afterWorker.results.length === 4 &&
        afterWorker.results[3].commandId === 'native-worker',
        'worker CAS was not durable or stale writer overwrote it');
      status.textContent = 'M1_V8_BROWSER_CAS_PASS';
    }
    run().catch(error => {
      status.textContent = 'M1_V8_BROWSER_CAS_FAIL: ' + String(error?.stack ?? error);
    });
  </script>
</body>
</html>
