# Version updates are distinct from Dependabot's repository-level security alerts
# and security update PRs. All PRs must pass the enforced main Ruleset gates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      non-major:
        update-types:
          - minor
          - patch
