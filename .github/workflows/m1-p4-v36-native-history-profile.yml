name: M1 P4 v36 native browser history profile (not a gate)

on:
  pull_request:
    paths:
      - 'examples/m1-v36-native-history-profile.html'
      - 'scripts/m1-v7-cdp-smoke.mjs'
      - 'docs/M1_V39_NATIVE_BROWSER_EXTENDED_HISTORY.md'
      - '.github/workflows/m1-p4-v36-native-history-profile.yml'
      - 'docs/M1_V36_NATIVE_BROWSER_HISTORY_PROFILE.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Number of synthetic fixtures (1-32)'
        type: number
        required: false
        default: 16

permissions: {}

jobs:
  native-profile:
    name: Chromium synthetic schema-6 history observation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FIXTURE_COUNT: ${{ inputs.fixtures }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated M1 modules
        run: npm run build:core
      - name: Measure actual browser IndexedDB API and reload
        shell: bash
        run: |
          set -euo pipefail
          fixtures="${FIXTURE_COUNT:-16}"
          [[ "$fixtures" =~ ^([1-9]|[12][0-9]|3[0-2])$ ]] || { echo 'Invalid fixture count'; exit 2; }
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/m1-v36-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:5173/examples/m1-v36-native-history-profile.html' > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/m1-v36-vite.log; exit 1; fi
          browser=""
          for executable in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$executable" > /dev/null 2>&1; then browser="$executable"; break; fi
          done
          [[ -n "$browser" ]] || { echo 'No browser executable'; exit 1; }
          node scripts/m1-v7-cdp-smoke.mjs "$browser" \
            "http://127.0.0.1:5173/examples/m1-v36-native-history-profile.html?fixtures=$fixtures" \
            M1_V36_BROWSER_PROFILE | tee /tmp/m1-v36-profile.log
          {
            echo '## Bounded native Chromium schema-6 observation (NOT release acceptance)'
            echo
            echo '~~~text'
            cat /tmp/m1-v36-profile.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
