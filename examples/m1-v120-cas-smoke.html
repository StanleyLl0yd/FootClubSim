<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>M1 v120 native source CAS</title></head>
<body>
<h1>v120 source/hold admission and persisted CAS browser regression</h1>
<pre id="status">M1_V120_BROWSER_CAS_RUNNING</pre>
<script type="module">
  import {createSyntheticRplScaleCatalog}
    from '../dist/core/synthetic.js';
  import {createInitialCareer}
    from '../dist/core/save.js';
  import {saveNewInitialCareer,loadInitialCareer}
    from '../dist/browser/initial-career-store.js';
  import {createM1V120PersistedJournal as create,
    loadM1V120PersistedJournal as load,
    commitM1V120PersistedSource as commit}
    from '../dist/browser/m1-v120-journal-store.js';
  import {startM1V120Journal,applyM1V120Source}
    from '../dist/core/m1-v120-playable-journal.js';
  import {reviewM1V126DenseSourceHolds}
    from '../dist/core/m1-v126-dense-source-holds.js';
  import {simulateM1V19InternalReferee}
    from '../dist/core/m1-v19-internal-foul-injury.js';
  import {buildM1V124GeneratedCommands}
    from '../dist/core/m1-v124-generated-source.js';
  import {admitM1V171SourceWithHolds}
    from '../dist/core/m1-v171-precommit-holds.js';
  import {buildM1V122NextOrdinaryFromVerified}
    from '../dist/core/m1-v122-dense-ordinary-season.js';
  import {prepareM1V166CombinedMatch}
    from '../dist/core/m1-v166-combined-playable.js';
  import {simulateM1V105SpecialGoalChronology}
    from '../dist/core/m1-v105-special-goal-chronology.js';

  const status=document.getElementById('status');
  const check=(value,why)=>{if(!value)throw Error(why);};
  const catalog=createSyntheticRplScaleCatalog(2026);
  function sample(){
    for(let seed=1;seed<=24;seed++){
      const career=createInitialCareer(catalog,catalog.clubs[0].id,
        seed,'m1-v120-native-cas');
      const started=startM1V120Journal(career);
      if(!started.ok)continue;
      const first=prepareM1V166CombinedMatch(
        career,started.journal,[]);
      if(!first?.ok)continue;
      const admitted=admitM1V171SourceWithHolds(
        career,started.journal,first.request);
      if(!admitted.ok)continue;
      const following=prepareM1V166CombinedMatch(
        career,admitted.journal,[]);
      if(following?.ok)return {career,first};
    }
    throw Error('no deterministic two-fixture legal source');
  }
  const {career,first}=sample();
  async function rejected(operation,expected){
    try{await operation;}
    catch(error){
      check(error?.code===expected,
        'expected '+expected+', got '+String(error));
      return;
    }
    throw Error('expected '+expected+' rejection');
  }
  async function run(){
    const stage=new URL(location.href).searchParams.get('stage');
    if(stage===null){
      await saveNewInitialCareer(career);
      const zero=await create(career.careerId);
      check(zero.revision===0,'new journal revision is not zero');
      const ordinary=buildM1V122NextOrdinaryFromVerified(
        career,zero,new Set());
      check(ordinary?.ok,'no ordinary first-fixture baseline');
      await rejected(commit(career.careerId,0,
        {...ordinary.request,
          commandId:'unverified-'+ordinary.fixture.id}),
        'ELIGIBILITY_REJECTED');
      const seed=ordinary.request.prematch.rngSeed;
      const forgedPrematch={...ordinary.request.prematch,
        rngSeed:seed===1?2:1};
      const replay=simulateM1V105SpecialGoalChronology(
        forgedPrematch,ordinary.request.policy,[],[],[],[]);
      check(replay.ok,'forged but source-replayable seed not available');
      await rejected(commit(career.careerId,0,{
        ...ordinary.request,
        commandId:'v128-fictional-continuation-'+ordinary.fixture.id,
        prematch:forgedPrematch,result:replay}),
        'ELIGIBILITY_REJECTED');
      check((await load(career.careerId)).revision===0,
        'source refusals unexpectedly wrote to IndexedDB');
      const tactical=structuredClone(first.request);
      tactical.prematch.homeTactics.tempo=
        tactical.prematch.homeTactics.tempo===51?52:51;
      const referee=simulateM1V19InternalReferee(
        tactical.prematch,tactical.policy);
      check(referee.ok,'no replayable altered-tactics referee');
      tactical.plannedCommands=buildM1V124GeneratedCommands(
        referee.generatedIncidents,first.fixture.id);
      tactical.result=simulateM1V105SpecialGoalChronology(
        tactical.prematch,tactical.policy,tactical.plannedCommands,[],[],[]);
      check(tactical.result.ok,'no replayable altered-tactics match');
      const legacy=applyM1V120Source(career,zero,tactical);
      check(legacy.ok&&reviewM1V126DenseSourceHolds(
        career,legacy.journal).ok,'old source boundary did not admit forgery');
      await rejected(commit(career.careerId,0,tactical),
        'ELIGIBILITY_REJECTED');
      check((await load(career.careerId)).revision===0,
        'altered-tactics claim advanced native journal');
      const one=await commit(career.careerId,0,first.request);
      check(one.revision===1&&one.entries.length===1&&
        one.entries[0].commandId.startsWith('v166-combined-'),
        'valid fictional source was not committed');
      const next=new URL(location.href);
      next.searchParams.set('stage','verify');
      location.replace(next.href);
      return;
    }
    check(stage==='verify','unexpected navigation stage');
    const restored=await loadInitialCareer(career.careerId);
    check(restored.careerId===career.careerId&&
      restored.rngState===career.rngState,'immutable initial career drifted');
    const prior=await load(career.careerId);
    check(prior.revision===1&&prior.entries.length===1&&
      prior.entries[0].commandId===first.request.commandId,
      'persisted source not recovered after real navigation');
    await rejected(create(career.careerId),'ALREADY_EXISTS');
    const prepared=prepareM1V166CombinedMatch(career,prior,[]);
    check(prepared?.ok,'cannot prepare source-verified continuation');
    await rejected(commit(career.careerId,0,prepared.request),
      'STALE_REVISION');
    const original=JSON.stringify(await load(career.careerId));
    await rejected(commit(career.careerId,1,{
      ...prepared.request,
      commandId:'unverified-'+prepared.fixture.id}),
      'ELIGIBILITY_REJECTED');
    check(JSON.stringify(await load(career.careerId))===original,
      'rejected future source mutated journal');
    const racers=await Promise.allSettled([
      commit(career.careerId,1,prepared.request),
      commit(career.careerId,1,prepared.request),
    ]);
    check(racers.filter(x=>x.status==='fulfilled').length===1,
      'two native competing writes both won or both lost');
    const loser=racers.find(x=>x.status==='rejected');
    check(loser?.reason?.code==='STALE_REVISION',
      'loser did not report stale revision');
    const committed=await load(career.careerId);
    check(committed.revision===2&&committed.entries.length===2&&
      committed.entries[0].commandId===prior.entries[0].commandId&&
      committed.entries[1].commandId===prepared.request.commandId,
      'native CAS lost history or duplicated accepted source');
    check((await loadInitialCareer(career.careerId)).careerId===
      career.careerId,'source CAS rewrote M0 save');
    status.textContent='M1_V120_BROWSER_CAS_PASS';
  }
  run().catch(error=>{
    status.textContent='M1_V120_BROWSER_CAS_FAIL: '+
      String(error?.stack??error);
  });
</script>
</body>
</html>
