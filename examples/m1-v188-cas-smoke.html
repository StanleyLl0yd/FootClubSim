<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>M1 v188 two-team native CAS</title></head>
<body>
<h1>M1 240-fixture two-team source persistence</h1>
<pre id="status">M1_V188_BROWSER_CAS_RUNNING</pre>
<script type="module">
  import {createSyntheticRplScaleCatalog}
    from '../dist/core/synthetic.js';
  import {createInitialCareer}
    from '../dist/core/save.js';
  import {saveNewInitialCareer,loadInitialCareer}
    from '../dist/browser/initial-career-store.js';
  import {createM1V188PersistedLeague as create,
    loadM1V188PersistedLeague as load,
    commitM1V188PersistedLeagueMatch as commit}
    from '../dist/browser/m1-v188-league-store.js';
  import {startM1V188LeagueJournal,prepareM1V188LeagueMatch,
    applyM1V188LeagueMatch,validateM1V188LeagueJournal,
    inspectM1V188FictionalHolds}
    from '../dist/core/m1-v188-league-source-journal.js';

  const status=document.getElementById('status');
  const check=(v,why)=>{if(!v)throw Error(why);};
  const yieldPage=()=>new Promise(resolve=>setTimeout(resolve,0));
  const catalog=createSyntheticRplScaleCatalog(2026);
  const career=seed=>createInitialCareer(
    catalog,catalog.clubs[0].id,seed,'m1-v188-native-cas');
  const minuteCareer=seed=>createInitialCareer(
    catalog,catalog.clubs[0].id,seed,'m1-v188-native-minute');
  const keeperCareer=seed=>createInitialCareer(
    catalog,catalog.clubs[0].id,seed,'m1-v188-native-keeper');
  const headCareer=seed=>createInitialCareer(
    catalog,catalog.clubs[0].id,seed,'m1-v188-native-head');
  const params=new URL(location.href).searchParams;
  async function rejected(op,code){
    try{await op;}catch(error){
      check(error?.code===code,'expected '+code+' got '+String(error));
      return;
    }
    throw Error('expected rejected '+code);
  }
  async function sample(){
    for(let seed=1;seed<=64;seed++){
      await yieldPage();
      const initial=career(seed);
      const started=startM1V188LeagueJournal(initial);
      if(!started.ok)continue;
      const first=prepareM1V188LeagueMatch(
        initial,started.journal,[],undefined,5);
      if(!first?.ok||first.request.medicalPolicyVersion!==5||
          first.externalMedicalAuthorityAuthenticated!==false||
          !first.sourceLaw5Evidence?.some(e=>
            e.sameWhistlePairOrdinal===2&&
            e.decisionEventId===null&&
            e.offenderPlayerId===null&&
            typeof e.sourceCollisionEventId==='string'))continue;
      const one=applyM1V188LeagueMatch(
        initial,started.journal,first.request);
      if(!one.ok)continue;
      await yieldPage();
      const next=prepareM1V188LeagueMatch(initial,one.journal);
      if(next?.ok)return {seed,initial,first};
    }
    throw Error('no source-bound two-patient two-fixture league seed');
  }
  async function sampleMinute(){
    for(let seed=1;seed<=48;seed++){
      await yieldPage();
      const initial=minuteCareer(seed);
      const zero=startM1V188LeagueJournal(initial);
      if(!zero.ok)continue;
      const first=prepareM1V188LeagueMatch(
        initial,zero.journal,[],undefined,6,undefined,2,[],2);
      if(!first?.ok||!first.selectedClubFixture)continue;
      const witness=first.sourceLaw5Evidence?.find(e=>
        e.modelledDisposition===
          'voluntary-extended-off-field-assessment');
      if(!witness||!first.request.intraphaseMedical?.some(a=>
        a.kind==='treatment-return'&&
        a.playerId===witness.patientPlayerId&&
        a.elapsedSeconds===witness.runningSeconds+60))continue;
      return {seed,initial,first};
    }
    throw Error('no source-timed minute-return native fixture witness');
  }
  async function sampleKeeper(){
    for(let seed=1;seed<=64;seed++){
      await yieldPage();
      const initial=keeperCareer(seed);
      const zero=startM1V188LeagueJournal(initial);
      if(!zero.ok)continue;
      const first=prepareM1V188LeagueMatch(
        initial,zero.journal,[],undefined,7,undefined,2,[],2);
      if(!first?.ok||!first.selectedClubFixture||
          !first.sourceLaw5Evidence?.some(e=>
            e.exception==='independent-single-goalkeeper-injury')||
          first.request.autonomousKeeperInjuryOrigin?.length!==1)continue;
      return {seed,initial,first};
    }
    throw Error('no independent-keeper native fixture witness');
  }
  async function sampleHead(){
    for(let seed=1;seed<=96;seed++){
      await yieldPage();
      const initial=headCareer(seed);
      const zero=startM1V188LeagueJournal(initial);
      if(!zero.ok)continue;
      const first=prepareM1V188LeagueMatch(
        initial,zero.journal,[],undefined,8,undefined,2,[],2);
      if(!first?.ok||!first.selectedClubFixture||
          first.request.autonomousHeadTraumaOrigin?.length!==1)continue;
      return {seed,initial,first};
    }
    throw Error('no native source-bound suspected head trauma witness');
  }
  async function run(){
    if(params.get('stage')===null){
      const {seed,initial,first}=await sample();
      await saveNewInitialCareer(initial);
      const zero=await create(initial.careerId);
      check(zero.revision===0,'fresh full league journal not empty');
      const forged=structuredClone(first.request);
      forged.result.report.home.goals++;
      await rejected(commit(initial.careerId,0,forged),'DOMAIN_REJECTED');
      check((await load(initial.careerId)).revision===0,
        'forged synthetic score wrote journal');
      const one=await commit(initial.careerId,0,first.request);
      check(one.entries[0].source.medicalPolicyVersion===5,
        'native CAS lost opt-in medical source policy');
      check(one.revision===1&&one.entries.length===1&&
        one.entries[0].fixtureId===first.fixture.id,
        'source verified first fixture not persisted');
      const minute=await sampleMinute();
      await saveNewInitialCareer(minute.initial);
      const minuteZero=await create(minute.initial.careerId);
      check(minuteZero.revision===0,'new minute journal not empty');
      const forgedMinute=structuredClone(minute.first.request);
      forgedMinute.intraphaseMedical[0].elapsedSeconds--;
      await rejected(commit(minute.initial.careerId,0,forgedMinute),
        'DOMAIN_REJECTED');
      check((await load(minute.initial.careerId)).revision===0,
        'forged 59-second return changed native history');
      const minuteSaved=await commit(minute.initial.careerId,0,
        minute.first.request);
      check(minuteSaved.entries[0].source.medicalPolicyVersion===6&&
        minuteSaved.entries[0].source.intraphaseMedical.length>0,
        'native CAS did not persist minute-source physical return');
      const keeper=await sampleKeeper();
      await saveNewInitialCareer(keeper.initial);
      const keeperZero=await create(keeper.initial.careerId);
      check(keeperZero.revision===0,'new keeper journal not empty');
      const forgedKeeper=structuredClone(keeper.first.request);
      forgedKeeper.autonomousKeeperInjuryOrigin[0].injuryEventId=
        'forged-keeper-source';
      await rejected(commit(keeper.initial.careerId,0,forgedKeeper),
        'DOMAIN_REJECTED');
      check((await load(keeper.initial.careerId)).revision===0,
        'forged keeper source changed native journal');
      const keeperSaved=await commit(keeper.initial.careerId,0,
        keeper.first.request);
      check(keeperSaved.entries[0].source.medicalPolicyVersion===7&&
        keeperSaved.entries[0].source.autonomousKeeperInjuryOrigin.length===1,
        'native CAS did not persist keeper origin');
      const head=await sampleHead();
      await saveNewInitialCareer(head.initial);
      const headZero=await create(head.initial.careerId);
      check(headZero.revision===0,'new head journal not empty');
      const forgedHead=structuredClone(head.first.request);
      forgedHead.autonomousHeadTraumaOrigin[0].clinicalDiagnosisAuthenticated=
        true;
      await rejected(commit(head.initial.careerId,0,forgedHead),
        'DOMAIN_REJECTED');
      check((await load(head.initial.careerId)).revision===0,
        'forged clinical claim mutated native head journal');
      const headSaved=await commit(head.initial.careerId,0,
        head.first.request);
      check(headSaved.entries[0].source.medicalPolicyVersion===8&&
        headSaved.entries[0].source.autonomousHeadTraumaOrigin.length===1,
        'native CAS lost unresolved head source');
      const held=inspectM1V188FictionalHolds(head.initial,headSaved);
      const victim=head.first.request.autonomousHeadTraumaOrigin[0];
      check(held.ok&&held.holds.some(h=>
        h.reason==='unresolved-head-trauma'&&
        h.playerId===victim.playerId&&h.missedOwnFixtures===null),
        'native head source unexpectedly granted medical clearance');
      const target=new URL(location.href);
      target.searchParams.set('headSeed',String(head.seed));
      target.searchParams.set('headFirst',head.first.fixture.id);
      target.searchParams.set('keeperSeed',String(keeper.seed));
      target.searchParams.set('keeperFirst',keeper.first.fixture.id);
      target.searchParams.set('minuteSeed',String(minute.seed));
      target.searchParams.set('minuteFirst',minute.first.fixture.id);
      target.searchParams.set('stage','verify');
      target.searchParams.set('seed',String(seed));
      target.searchParams.set('first',first.fixture.id);
      location.replace(target.href);
      return;
    }
    check(params.get('stage')==='verify','unknown stage');
    const seed=Number(params.get('seed'));
    check(Number.isSafeInteger(seed)&&seed>=1&&seed<=64,
      'invalid preserved seed');
    const initial=career(seed);
    const savedInitial=await loadInitialCareer(initial.careerId);
    check(savedInitial.careerId===initial.careerId&&
      savedInitial.rngState===initial.rngState,
      'immutable initial career changed');
    const prior=await load(initial.careerId);
    check(prior.revision===1&&prior.entries.length===1&&
      prior.entries[0].fixtureId===params.get('first'),
      'first full-league fixture not restored');
    check(prior.entries[0].source.medicalPolicyVersion===5,
      'browser reload lost opt-in medical policy');
    check(validateM1V188LeagueJournal(initial,prior).ok,
      'restored source rejected full replay');
    await rejected(create(initial.careerId),'ALREADY_EXISTS');
    const next=prepareM1V188LeagueMatch(initial,prior);
    check(next?.ok,'cannot prepare next league fixture');
    check(next.request.medicalPolicyVersion===5,
      'browser CAS permitted medical source downgrade');
    check(next.fixture.id!==prior.entries[0].fixtureId,
      'opponent fixture ordering is stale');
    await rejected(commit(initial.careerId,0,next.request),
      'STALE_REVISION');
    const before=JSON.stringify(await load(initial.careerId));
    const downgraded=structuredClone(next.request);
    delete downgraded.medicalPolicyVersion;
    await rejected(commit(initial.careerId,1,downgraded),
      'DOMAIN_REJECTED');
    check(JSON.stringify(await load(initial.careerId))===before,
      'medical-policy downgrade altered native history');
    const fake=structuredClone(next.request);
    fake.commandId='v188-league-forged';
    await rejected(commit(initial.careerId,1,fake),'DOMAIN_REJECTED');
    check(JSON.stringify(await load(initial.careerId))===before,
      'failed second-fixture claim mutated history');
    const racers=await Promise.allSettled([
      commit(initial.careerId,1,next.request),
      commit(initial.careerId,1,next.request),
    ]);
    check(racers.filter(x=>x.status==='fulfilled').length===1,
      'two native CAS writers unexpectedly succeeded');
    check(racers.filter(x=>x.status==='rejected').every(x=>
      x.reason?.code==='STALE_REVISION'),
      'CAS loser not classified as stale');
    const done=await load(initial.careerId);
    check(done.revision===2&&done.entries.length===2&&
      done.entries[0].fixtureId===prior.entries[0].fixtureId&&
      done.entries[1].fixtureId===next.fixture.id&&
      done.entries.every(e=>e.source.medicalPolicyVersion===5),
      'chronological two-team journal lost entries');
    check((await loadInitialCareer(initial.careerId)).careerId===
      initial.careerId,'full-league CAS rewrote M0');
    const minuteSeed=Number(params.get('minuteSeed'));
    check(Number.isSafeInteger(minuteSeed)&&minuteSeed>=1&&
      minuteSeed<=48,'invalid minute-return seed');
    const minuteInitial=minuteCareer(minuteSeed);
    const restoredMinuteInitial=await loadInitialCareer(
      minuteInitial.careerId);
    check(restoredMinuteInitial.careerId===minuteInitial.careerId&&
      restoredMinuteInitial.rngState===minuteInitial.rngState,
      'minute-return career initial changed on reload');
    const minutePrior=await load(minuteInitial.careerId);
    check(minutePrior.revision===1&&
      minutePrior.entries[0].fixtureId===params.get('minuteFirst')&&
      minutePrior.entries[0].source.medicalPolicyVersion===6,
      'minute-return native history not restored');
    const minuteSource=minutePrior.entries[0].source;
    check(minuteSource.intraphaseMedical.some(action=>
      action.kind==='treatment-return'&&
      minuteSource.checkpointMedical.some(exit=>
        exit.kind==='treatment-exit'&&
        exit.playerId===action.playerId&&
        exit.teamId===action.teamId&&
        action.elapsedSeconds-exit.elapsedSeconds===60)),
    'restored native physical return is not at T+60');
    check(validateM1V188LeagueJournal(
      minuteInitial,minutePrior).ok,
      'minute-return native history fails exact replay');
    const nextMinute=prepareM1V188LeagueMatch(
      minuteInitial,minutePrior,[],undefined,undefined,undefined,
      2,[],2);
    check(nextMinute?.ok&&nextMinute.request.medicalPolicyVersion===6,
      'minute-return native policy failed to survive reload');
    const minuteDone=await commit(minuteInitial.careerId,1,
      nextMinute.request);
    check(minuteDone.revision===2&&
      minuteDone.entries.every(e=>e.source.medicalPolicyVersion===6)&&
      validateM1V188LeagueJournal(minuteInitial,minuteDone).ok,
      'minute-return full two-fixture CAS failed');
    const keeperSeed=Number(params.get('keeperSeed'));
    check(Number.isSafeInteger(keeperSeed)&&keeperSeed>=1&&
      keeperSeed<=64,'invalid keeper seed');
    const keeperInitial=keeperCareer(keeperSeed);
    const restoredKeeperInitial=await loadInitialCareer(
      keeperInitial.careerId);
    check(restoredKeeperInitial.careerId===keeperInitial.careerId,
      'independent keeper initial not restored');
    const keeperPrior=await load(keeperInitial.careerId);
    check(keeperPrior.revision===1&&
      keeperPrior.entries[0].fixtureId===params.get('keeperFirst')&&
      keeperPrior.entries[0].source.medicalPolicyVersion===7&&
      keeperPrior.entries[0].source.autonomousKeeperInjuryOrigin.length===1,
      'independent goalkeeper history not restored');
    check(validateM1V188LeagueJournal(
      keeperInitial,keeperPrior).ok,
      'independent goalkeeper journal failed exact replay');
    const keeperNext=prepareM1V188LeagueMatch(
      keeperInitial,keeperPrior,[],undefined,undefined,undefined,
      2,[],2);
    check(keeperNext?.ok&&keeperNext.request.medicalPolicyVersion===7,
      'native keeper policy downgraded after reload');
    const keeperDone=await commit(keeperInitial.careerId,1,
      keeperNext.request);
    check(keeperDone.revision===2&&
      keeperDone.entries.every(e=>e.source.medicalPolicyVersion===7)&&
      validateM1V188LeagueJournal(keeperInitial,keeperDone).ok,
      'independent keeper two-fixture browser CAS failed');
    const headSeed=Number(params.get('headSeed'));
    check(Number.isSafeInteger(headSeed)&&headSeed>=1&&
      headSeed<=96,'invalid head seed');
    const headInitial=headCareer(headSeed);
    const restoredHeadInitial=await loadInitialCareer(headInitial.careerId);
    check(restoredHeadInitial.careerId===headInitial.careerId,
      'head initial not restored across page reload');
    const headPrior=await load(headInitial.careerId);
    check(headPrior.revision===1&&
      headPrior.entries[0].fixtureId===params.get('headFirst')&&
      headPrior.entries[0].source.medicalPolicyVersion===8&&
      headPrior.entries[0].source.autonomousHeadTraumaOrigin.length===1,
      'native head source lost on restart');
    check(validateM1V188LeagueJournal(headInitial,headPrior).ok,
      'cold native head source replay mismatch');
    const headVictim=headPrior.entries[0].source.
      autonomousHeadTraumaOrigin[0];
    const headHolds=inspectM1V188FictionalHolds(headInitial,headPrior);
    check(headHolds.ok&&headHolds.holds.some(h=>
      h.reason==='unresolved-head-trauma'&&
      h.playerId===headVictim.playerId&&
      h.remainingOwnFixtures===null),
      'native head clearance was accidentally persisted');
    const nextHead=prepareM1V188LeagueMatch(
      headInitial,headPrior,[],undefined,undefined,undefined,2,[],2);
    check(nextHead?.ok&&nextHead.request.medicalPolicyVersion===8,
      'native head policy downgraded after reload');
    const headDone=await commit(headInitial.careerId,1,nextHead.request);
    check(headDone.revision===2&&
      headDone.entries.every(e=>e.source.medicalPolicyVersion===8)&&
      validateM1V188LeagueJournal(headInitial,headDone).ok,
      'native head two-fixture CAS and replay failed');
    status.textContent='M1_V188_BROWSER_CAS_PASS';
  }
  run().catch(error=>{
    status.textContent='M1_V188_BROWSER_CAS_FAIL: '+
      String(error?.stack??error);
  });
</script>
</body>
</html>
